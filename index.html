<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLMs and Civic Discourse — Literature Review Dashboard</title>
  <meta name="description" content="This dashboard highlights recent research on how large language models (LLMs) shape civic discourse. The collection includes empirical studies examining political bias in LLM outputs, longitudinal audits tracking how LLMs handle political content over time, and experimental research testing how LLMs affect learning outcomes and political beliefs. It also features papers investigating trends in automated content moderation, including refusal patterns and potential speech suppression for different identity groups. Several papers explore whether and how LLMs might support democratic processes—from improving online political conversations to assisting with democratic deliberation. Together, these papers serve as a helpful primer for understanding current research on how LLMs are shaping political communication and civic participation."/>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Design tokens — shared with the home/about repos */
    :root {
      --space-025: 2px;  --space-100: 8px;  --space-300: 24px; --space-600: 48px;
      --space-050: 4px;  --space-150: 12px; --space-400: 32px; --space-800: 64px;
      --space-075: 6px;  --space-200: 16px; --space-500: 40px; --space-1000: 80px;
      --space-250: 20px;

      --c-bg:        #ffffff;
      --c-dark:      #0d0d0c;
      --c-light-bg:  #f8f7f4;
      --c-accent:    #5533ee;
      --c-red:       #f03d1f;
      /* Deeper red-orange — the gradient's closing stop, promoted to a token
         of its own. Link text on a white/light ground uses this: --c-red
         only reaches ~3.9:1 against white, this clears 4.5:1. --c-red stays
         the brand accent for fills, borders, icons, tags and labels. */
      --c-red-dark:  #df3611;
      --c-gray:      #888680;
      --c-gray-dark: #54534f;
      --c-muted:     #c8c6c0;
      --c-white:     #ffffff;
      --c-border:    rgba(13,13,12,0.1);

      /* Two families, no third — and the split is by what the text IS, not by
         heading level. --f-serif: page titles, and titles of works or names of
         people (a post title, a paper title, a person's name), plus pull-quote
         copy. --f-sans: section headings, card and UI labels, running prose,
         metadata, controls and uppercase micro-labels.
         The one that trips people up: a SECTION HEADING IS NOT SERIF. Serif
         marks a thing that has its own name; sans marks the furniture around
         it. See README -> Typography. */
      --f-serif: 'EB Garamond', Georgia, 'Times New Roman', serif;
      --f-sans:  'DM Sans', system-ui, -apple-system, sans-serif;
      /* -- Type scale (sitewide -- see README) --
         Fluid clamps interpolate across the viewport, so tablet needs no
         separate breakpoint. 12px is the floor; nothing ships smaller.   */
      --fs-display:     clamp(36px, 22.7px + 3.70vw, 76px);
      --fs-h1:          clamp(36px, 29.3px + 1.85vw, 56px);
      --fs-h2:          clamp(26px, 21.3px + 1.30vw, 40px);
      --fs-h3:          clamp(20px, 18.7px + 0.37vw, 24px);
      --fs-lede:        clamp(18px, 17.3px + 0.19vw, 20px);
      --fs-body:        16px;
      --fs-small:       14px;
      --fs-small-serif: 15px;
      --fs-micro:       12px;

      --lh-display: 1.05;
      --lh-heading: 1.15;
      --lh-lede:    1.26;
      --lh-title:   1.3;
      --lh-body:    1.55;

      --c-pale-orange: #fce4dc;
      /* Corner radii — shared with research-compendium: cards 6px (home's
         .news-card), buttons / fields / tags 4px (the footer Subscribe button). */
      --radius-card:    6px;
      --radius-control: 4px;
    }

    body {
      font-family: var(--f-serif);
      background: var(--c-light-bg);
      color: var(--c-dark);
      -webkit-font-smoothing: antialiased;
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .paper-row { animation: fadeSlideIn 0.3s ease forwards; }
    select option { background: var(--c-white); color: var(--c-dark); }
    ::placeholder { color: var(--c-dark); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(13,13,12,0.15); border-radius: 3px; }

    /* Responsive layout — shared 1440px page cap / 80px side padding scale,
       stepping down to 32px at 900px and 20px at 480px, matching the
       about/home/grants-overview `--pad-x` convention. */
    .dashboard-container { max-width: 1440px; margin: "var(--space-025)" auto; padding-left: var(--space-1000); padding-right: var(--space-1000); }
    @media (max-width: 900px) {
      .dashboard-container { padding-left: var(--space-400); padding-right: var(--space-400); }
    }
    @media (max-width: 480px) {
      .dashboard-container { padding-left: var(--space-250); padding-right: var(--space-250); }
    }

    .papers-list { display: flex; flex-direction: column; gap: var(--space-150); }
    .paper-row-top {
      display: grid;
      grid-template-columns: 2fr 200px 64px 2.4fr;
      gap: var(--space-300);
      align-items: start;
    }
    /* Grid/flex children default to min-width:auto, which lets long
       unbroken text (titles, journal names) push past the card edge
       instead of wrapping — force every descendant to actually shrink. */
    .paper-row-top, .paper-row-top * { min-width: 0; }

    @media (max-width: 900px) {
      .paper-row-top {
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "title  title"
          "authors year"
          "preview preview";
        gap: var(--space-100) var(--space-200);
      }
      .paper-row-title  { grid-area: title; }
      .paper-row-authors{ grid-area: authors; }
      .paper-row-year   { grid-area: year; }
      .paper-row-preview{ grid-area: preview; }
    }

    /* Stats-band pillar-group: 2-up grid collapses to 1 column, matching
       grants-overview's .pillar-group breakpoint (never let a multi-column
       grid just shrink its columns — reflow to fewer instead). */
    @media (max-width: 900px) {
      .header-flex { grid-template-columns: minmax(0, 1fr) !important; }
    }

    @media (max-width: 768px) {
      .controls-row { flex-direction: column; }
    }

    @media (max-width: 600px) {
      .paper-row-top { grid-template-columns: 1fr; grid-template-areas: "title" "authors" "year" "preview"; }
    }

    /* -------------------------------------------------------------------
       Whole-box link to another web page (Hyperlinks category 4).
       Black circle + gradient-slide arrow badge, matching about /
       team-leadership / home / data. The box reserves extra top padding
       so the badge stays clear of the heading.
       ------------------------------------------------------------------- */
    .card-arrow {
      position: absolute;
      top: var(--space-100);
      right: var(--space-100);
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--c-dark);
      color: var(--c-white);
      font-family: var(--f-sans);
      font-size: var(--fs-micro);
      line-height: 1;
      transition: transform 0.2s ease;
      pointer-events: none;
    }
    @keyframes card-arrow-slide {
      0%   { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    a:hover .card-arrow {
      transform: scale(1.15) translate(2px, -2px);
      background: linear-gradient(100deg, var(--c-accent), var(--c-red), var(--c-accent));
      background-size: 220% 100%;
      animation: card-arrow-slide 1.2s linear infinite;
    }

    /* White tile that lifts with depth on hover — the same treatment as
       team-leadership's .person-card and about's logo tiles. Movement,
       not a colour swap. */
    .convening-block--link {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: var(--space-150);
      min-width: 0;
      background: var(--c-white);
      border: 1px solid rgba(13, 13, 12, 0.08);
      padding: var(--space-500) var(--space-300) var(--space-250);
      text-decoration: none;
      transition: box-shadow 0.15s, transform 0.15s;
    }
    .convening-block--link:hover {
      box-shadow: 0 12px 24px rgba(13, 13, 12, 0.16);
      transform: translateY(-4px);
    }

    @media (prefers-reduced-motion: reduce) {
      .convening-block--link,
      .convening-block--link:hover,
      .card-arrow,
      a:hover .card-arrow {
        transform: none;
        animation: none;
        transition: none;
      }
    }
    /* ===================================================================
       Shared with research-compendium (see its README): column header row,
       boxed summary on a light-gray open area, category 2 paper link,
       softened corners on the Related Center Programming tiles.
       =================================================================== */
    .papers-head {
      display: grid; grid-template-columns: 2fr 200px 64px 2.4fr; gap: var(--space-300);
      padding: 0 calc(var(--space-250) + 1px) var(--space-100);
      margin-bottom: var(--space-150); border-bottom: 1px solid var(--c-border);
      font-family: var(--f-sans); font-size: var(--fs-micro); font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--c-gray-dark);
    }
    @media (max-width: 900px) { .papers-head { display: none; } }

    .paper-detail {
      background: var(--c-light-bg); border-top: 1px solid var(--c-border);
      padding: var(--space-300) var(--space-250);
      display: flex; flex-direction: column; gap: var(--space-250);
    }
    .paper-detail__box {
      background: var(--c-white); border: 1px solid var(--c-border); border-radius: var(--radius-card);
      box-shadow: 0 16px 40px rgba(13,13,12,0.10); padding: var(--space-300);
      position: relative; overflow: hidden;
    }
    /* Brand gradient top edge — the same accent research-compendium's
       "Why is this important?" card carries. */
    .paper-detail__box::before {
      content: ''; position: absolute; inset: 0 0 auto 0; height: 4px;
      background: linear-gradient(150deg, #5533ee 0%, #df3611 81%);
    }
    .paper-detail__box h4 {
      font-family: var(--f-sans); font-size: var(--fs-h3); font-weight: 700;
      line-height: var(--lh-heading); margin-bottom: var(--space-150); color: var(--c-dark);
    }
    .paper-detail__box p {
      font-family: var(--f-sans); font-size: var(--fs-body); font-weight: 300;
      line-height: var(--lh-body); color: var(--c-dark); max-width: 1000px;
    }
    @media (max-width: 600px) {
      .paper-detail { padding: var(--space-250) var(--space-200); }
      .paper-detail__box { padding: var(--space-250) var(--space-200); }
    }
    /* Category 2 — independent link to a research paper. */
    .link-independent {
      display: inline-flex; align-items: baseline; gap: var(--space-075);
      font-family: var(--f-sans); font-size: var(--fs-small); font-weight: 600;
      color: var(--c-dark); text-decoration: none; border-bottom: 1px solid rgba(13,13,12,0.35);
      transition: color 0.15s, border-color 0.15s;
    }
    .link-independent:hover { color: var(--c-red-dark); border-color: var(--c-red-dark); }

    .pillar-box { border-radius: var(--radius-card); }
  
/* ── Trailing-margin guard ─────────────────────────────────────────────────
   These pages are embedded in an iframe that is resized to the height this
   page reports, and that height is measured from document.body.

   A bottom margin on the last element COLLAPSES THROUGH body and out to
   <html>. It never appears in body.scrollHeight, but it does extend
   documentElement.scrollHeight — so the frame gets sized short of the real
   document, the embedded page is left with a few px it can scroll, and it
   swallows the visitor's wheel events: the outer page then only scrolls when
   the cursor is over its scrollbar. It has bitten twice (home, 64px;
   grants-overview, 80px) and it is invisible in the builder.

   display: flow-root makes body a block formatting context, so descendant
   margins can no longer escape it and the measured height is always the whole
   document. Cheap, and it removes a whole class of bug rather than one
   instance. If a page grows here, something was relying on a margin escaping
   — convert that margin to padding rather than removing this.
   ====================================================================== */
body { display: flow-root; }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- React 18.3.1 and the compiled app, served from this repo.

       These were three <script> tags pointing at cdnjs: react, react-dom and
       babel-standalone. That meant the page could not render at all unless a
       visitor's network reached cdnjs — a blocked or slow CDN, a corporate or
       campus filter, or a script blocker produced a completely blank page —
       and every single visit downloaded ~1.1MB of Babel and then compiled the
       JSX below in the browser before anything appeared.

       The JSX is now compiled ahead of time into vendor/app.js (run
       `npx babel --presets @babel/preset-react` on the JSX source if you need
       to regenerate it), and React ships from this repo. No third-party
       requests, no in-browser compile step. Edit app.js directly, or keep a
       JSX source alongside it and recompile. -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/app.js"></script>

  <script>
    // Auto-resize: sends page height to parent iframe so WordPress can resize accordingly
    window._lastSentHeight = 0;
    /* The global footer opens with a glyph band that blends the page into the
       footer gradient. It needs to know what colour this page ENDS on, and it
       cannot read it: this page is a cross-origin iframe. So we measure the
       closing block's background here and send it along with the height. The
       footer listens for the same message the resize snippet already posts,
       so the embed code does not change.

       "Closing block" = the last top-level element that actually paints a
       background. Walking from the end skips trailing <script> tags and any
       transparent wrapper. */
    var edgeColor = null;
    function readEdgeColor() {
      /* The lowest element on the page that actually paints a background.
         Not simply the last child of <body>: a React root, an app shell or
         any transparent wrapper would answer "transparent" and tell the
         footer nothing. Falls back to the page's own background. */
      function opaque(bg) {
        return bg && bg !== 'transparent' && !/rgba\(\s*0,\s*0,\s*0,\s*0\s*\)/.test(bg);
      }
      var best = null, bestBottom = -1;
      var all = document.body.querySelectorAll('*');
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        var cs = getComputedStyle(el);
        if (cs.position === 'fixed' || cs.display === 'none' || cs.visibility === 'hidden') continue;
        if (!opaque(cs.backgroundColor)) continue;
        var r = el.getBoundingClientRect();
        if (r.height < 8 || r.width < 8) continue;
        if (r.bottom > bestBottom) { bestBottom = r.bottom; best = cs.backgroundColor; }
      }
      if (best) return best;
      var b = getComputedStyle(document.body).backgroundColor;
      if (opaque(b)) return b;
      var h = getComputedStyle(document.documentElement).backgroundColor;
      return opaque(h) ? h : null;
    }

    function sendHeight() {
      if (window.self === window.top) return;
      /* MEASURE THE BODY, NEVER documentElement. <html> stretches to fill the
           frame, so documentElement.scrollHeight can never report LESS than the
           frame's current height — feeding it back pins the iframe at whatever
           it already is and it can never shrink. Anything that inflates it once
           during load (webfonts settling, the reveal transforms) is then
           permanent, which is what left a tall band of white above the footer.
           body.scrollHeight is content-driven and can go down as well as up.
           Verified 2026-09: at 1512px wide home's real content is 3879px while
           documentElement.scrollHeight reported 4766px, the frame's own height. */
      var height = Math.ceil(Math.max(
        document.body.scrollHeight,
        document.body.offsetHeight
      ));
      if (Math.abs(height - window._lastSentHeight) < 2) return;
      window._lastSentHeight = height;
      if (edgeColor === null) edgeColor = readEdgeColor();
      window.parent.postMessage({ frameHeight: height, edgeColor: edgeColor }, "*");
    }
    // Send on load
    window.addEventListener("load", sendHeight);
    // Send whenever content changes (e.g. cards expand/collapse)
    var observer = new ResizeObserver(sendHeight);
    observer.observe(document.body);
    /* Late-settling layout: webfonts swapping in, images decoding, a lazy
       iframe resolving. ResizeObserver catches most of it, but a change that
       lands between the last observed tick and paint can leave the frame a
       few px short of the content. Two cheap re-measures after load close
       that window; sendHeight's hysteresis makes a no-op re-post free. */
    setTimeout(sendHeight, 300);
    setTimeout(sendHeight, 1200);
  </script>
</body>
</html>
