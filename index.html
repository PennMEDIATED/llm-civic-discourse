  <title>LLMs and Civic Discourse — Literature Review Dashboard</title>
  <meta name="description" content="This dashboard highlights recent research on how large language models (LLMs) shape civic discourse. The collection includes empirical studies examining political bias in LLM outputs, longitudinal audits tracking how LLMs handle political content over time, and experimental research testing how LLMs affect learning outcomes and political beliefs. It also features papers investigating trends in automated content moderation, including refusal patterns and potential speech suppression for different identity groups. Several papers explore whether and how LLMs might support democratic processes—from improving online political conversations to assisting with democratic deliberation. Together, these papers serve as a helpful primer for understanding current research on how LLMs are shaping political communication and civic participation."/>

      // Yellow updated to match the analogous-colors reference (#FFCF26),

      // (light tint / saturated border / dark text) as every other tag.

    const allTags = [...new Set(papers.flatMap((p) => p.tags))].sort((a, b) => {
      const order = Object.keys(TAG_COLORS);
      const ia = order.indexOf(a);
      const ib = order.indexOf(b);
      if (ia === -1 && ib === -1) return a.localeCompare(b);
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });

    function getTagStyle(tag) {
      return TAG_COLORS[tag] || { bg: "#f4f4f2", border: "#888", text: "#555" };
    }

    function applySort(list, order) {
      return list.slice().sort(function(a, b) {
        if (order === "year-desc") {
          var aPenn = a.tags.includes("Penn Research");
          var bPenn = b.tags.includes("Penn Research");
          if (aPenn !== bPenn) return aPenn ? -1 : 1;
          return b.year - a.year;
        }
        if (order === "year-asc") return a.year - b.year;
        if (order === "title-asc") return a.title < b.title ? -1 : a.title > b.title ? 1 : 0;
        if (order === "title-desc") return b.title < a.title ? -1 : b.title > a.title ? 1 : 0;
        return 0;
      });
    }

    function Dashboard() {
      const [sortOrder, setSortOrder] = useState("year-desc");
      const [activeTags, setActiveTags] = useState([]);
      const [search, setSearch] = useState("");

        setActiveTags((prev) =>
          prev.includes(tag) ? prev.filter((t) => t !== tag) : [...prev, tag]
        );
      };

      let filtered = papers;
      if (activeTags.length > 0) {
        const pennSelected = activeTags.includes("Penn Research");
        const themeFilters = activeTags.filter((t) => t !== "Penn Research");
        filtered = filtered.filter((p) => {
          const matchesTheme = themeFilters.length === 0 || themeFilters.some((t) => p.tags.includes(t));
          const matchesPenn = !pennSelected || p.tags.includes("Penn Research");
          return matchesTheme && matchesPenn;
        });
      }
      if (search.trim()) {
        const q = search.toLowerCase();
        filtered = filtered.filter(
          (p) =>
            p.title.toLowerCase().includes(q) ||
            p.authors.toLowerCase().includes(q) ||
            p.summary.toLowerCase().includes(q) ||
            p.journal.toLowerCase().includes(q)
        );
      }
      filtered = applySort(filtered, sortOrder);
      return (
        <div style={{ minHeight: "100vh" }}>

              programming instead of aggregate stats. Placed directly below the hero
              so the Center's programming frames the paper list below it. */}
          <div className="stats-band" style={{ background: "var(--c-accent)", padding: "var(--space-1000) 0" }}>
            <div className="dashboard-container" style={{ maxWidth: 1440, margin: "0 auto" }}>
              <h2 style={{
                fontFamily: "var(--f-sans)", fontSize: "var(--fs-h2)", fontWeight: 600, letterSpacing: "-0.02em",
                lineHeight: "var(--lh-heading)", color: "var(--c-white)", margin: "0 0 var(--space-300)",
              }}>
                Related Center Programming
              </h2>
              <div className="header-flex" style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0, 1fr))", gap: "var(--space-200)" }}>
                <div className="convening-block pillar-box" style={{ background: "var(--c-light-bg)", border: "1px solid rgba(255,255,255,0.16)", padding: "var(--space-250) var(--space-300)", display: "flex", flexDirection: "column", gap: "var(--space-150)", minWidth: 0 }}>
                  <h3 style={{
                    fontFamily: "var(--f-sans)",
                    fontSize: "var(--fs-body)",
                    fontWeight: 600,
                    color: "var(--c-red)",
                    margin: "var(--space-025)",
                    lineHeight: "var(--lh-title)",
                  }}>
                    Convening on LLMs and Civic Discourse
                  </h3>
                  <p style={{
                    fontFamily: "var(--f-sans)",
                    fontSize: "var(--fs-small)",
                    color: "var(--c-dark)",
                    margin: "var(--space-025)",
                    lineHeight: "var(--lh-body)",
                    fontWeight: 300,
                  }}>
                    On March 4th, Penn MEDIATED hosted an online convening of prominent academic researchers and civil society organizations to share results from, and approaches to, monitoring and evaluating LLM civic discourse—how LLMs discuss political topics, refer to politicians, and relate election information. You can see the topic primer for that convening below.
                  </p>
                  <a
                    href="LLM Civic Discourse Convening - Topic Primer.pdf"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="cta-btn"
                    style={{
                      display: "inline-flex",
                      alignItems: "center",
                      gap: "var(--space-150)",
                      alignSelf: "flex-start",
                      padding: "var(--space-100) var(--space-200)",
                      background: "var(--c-red)",
                      color: "var(--c-white)",
                      borderRadius: 0,
                      textDecoration: "none",
                      fontFamily: "var(--f-sans)",
                      fontSize: "var(--fs-small)",
                      fontWeight: 500,
                      lineHeight: "var(--lh-body)",
                      transition: "background 0.2s",
                    }}
                    onMouseEnter={e => { e.currentTarget.style.background = "var(--c-red-dark)"; }}
                    onMouseLeave={e => { e.currentTarget.style.background = "var(--c-red)"; }}
                  >
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}>
                      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
                    </svg>
                    LLM Civic Discourse – Topic Primer
                  </a>
                </div>
                <div className="convening-block pillar-box" style={{ background: "var(--c-light-bg)", border: "1px solid rgba(255,255,255,0.16)", padding: "var(--space-250) var(--space-300)", display: "flex", flexDirection: "column", gap: "var(--space-150)", minWidth: 0 }}>
                  <h3 style={{
                    fontFamily: "var(--f-sans)",
                    fontSize: "var(--fs-body)",
                    fontWeight: 600,
                    color: "var(--c-red)",
                    margin: "var(--space-025)",
                    lineHeight: "var(--lh-title)",
                  }}>
                    Research Grants on LLM Civic Discourse
                  </h3>
                  <p style={{
                    fontFamily: "var(--f-sans)",
                    fontSize: "var(--fs-small)",
                    color: "var(--c-dark)",
                    margin: "var(--space-025)",
                    lineHeight: "var(--lh-body)",
                    fontWeight: 300,
                  }}>
                    In 2026, Penn MEDIATED funded four grants to expand Penn's research on this essential topic:
                  </p>
                  <ul style={{
                    fontFamily: "var(--f-sans)",
                    fontSize: "var(--fs-small)",
                    color: "var(--c-dark)",
                    fontWeight: 300,
                    lineHeight: "var(--lh-body)",
                    paddingLeft: "var(--space-250)",
                    margin: "var(--space-025)",
                    display: "flex",
                    flexDirection: "column",
                    gap: "var(--space-075)",
                  }}>
                    <li>AI Watchman: Longitudinally Auditing Generative AI Content Moderation of Social Issues</li>
                    <li>Adversarial Testing of Misalignment in Frontier LLMs: When Asked to Create Anti-Democratic Campaign Materials</li>
                    <li>Information Density and Narrative Persuasion in AI Chatbots: Cross-National Evidence from India and the United States</li>
                    <li>How AI Transforms News: Measuring Bias and Distortion During LLM Conversations</li>
                  </ul>
                  <a
                    href="http://infodem.upenn.edu/grants"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="cta-btn"
                    style={{
                      display: "inline-flex",
                      alignItems: "center",
                      gap: "var(--space-150)",
                      alignSelf: "flex-start",
                      padding: "var(--space-100) var(--space-200)",
                      background: "var(--c-red)",
                      color: "var(--c-white)",
                      borderRadius: 0,
                      textDecoration: "none",
                      fontFamily: "var(--f-sans)",
                      fontSize: "var(--fs-small)",
                      fontWeight: 500,
                      lineHeight: "var(--lh-body)",
                      transition: "background 0.2s",
                    }}
                    onMouseEnter={e => { e.currentTarget.style.background = "var(--c-red-dark)"; }}
                    onMouseLeave={e => { e.currentTarget.style.background = "var(--c-red)"; }}
                  >
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}>
                      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
                    </svg>
                    Penn MEDIATED Research Grants
                  </a>
                </div>
              </div>
            </div>
          </div>

          {/* Controls — reskinned as grants-overview's .filter-row: a single
              bordered, sharp-cornered box (light-bg fields, no rounded
              corners) instead of a borderless row. Theme filtering keeps
              this dashboard's richer multi-select toggle chips rather than
              grants-overview's single <select>, but the chips themselves are
              now sharp-cornered tags instead of rounded pills. */}
          <div style={{ background: "var(--c-light-bg)" }}>
          <div className="dashboard-container" style={{ maxWidth: 1440, margin: "0 auto", paddingTop: "var(--space-250)", paddingBottom: "var(--space-200)" }}>
            <div className="filter-row" style={{ display: "flex", gap: "var(--space-150)", flexWrap: "wrap", alignItems: "center", background: "var(--c-bg)", border: "1px solid var(--c-border)", padding: "var(--space-200) var(--space-200)", marginBottom: "var(--space-250)" }}>
              <div style={{ position: "relative", flex: "1 1 200px", minWidth: 160, width: 260 }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--c-gray)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ position: "absolute", left: 11, top: "50%", transform: "translateY(-50%)", pointerEvents: "none" }}>
                  <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input
                  type="text"
                  placeholder="Search titles, authors, or content."
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  style={{
                    width: "100%",
                    padding: "var(--space-100) var(--space-150) var(--space-100) var(--space-400)",
                    borderRadius: 0,
                    border: "1px solid var(--c-border)",
                    background: "var(--c-light-bg)",
                    color: "var(--c-dark)",
                    fontSize: "var(--fs-small)",
                    fontFamily: "var(--f-sans)",
                    fontWeight: 400,
                    outline: "none",
                    boxSizing: "border-box",
                    transition: "border-color 0.2s",
                  }}
                  onFocus={(e) => e.target.style.borderColor = "var(--c-red)"}
                  onBlur={(e) => e.target.style.borderColor = "var(--c-border)"}
                />
              </div>
              <select
                value={sortOrder}
                onChange={(e) => setSortOrder(e.target.value)}
                style={{
                  padding: "var(--space-100) var(--space-400) var(--space-100) var(--space-150)",
                  borderRadius: 0,
                  border: "1px solid var(--c-border)",
                  background: "var(--c-light-bg)",
                  color: "var(--c-dark)",
                  fontSize: "var(--fs-small)",
                  fontFamily: "var(--f-sans)",
                  cursor: "pointer",
                  outline: "none",
                  WebkitAppearance: "none",
                  MozAppearance: "none",
                  appearance: "none",
                  backgroundImage: "url(\"data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23888680' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E\")",
                  backgroundRepeat: "no-repeat",
                  backgroundPosition: "right 12px center",
                }}
              >
                {SORT_OPTIONS.map((o) => (
                  <option key={o.value} value={o.value}>{o.label}</option>
                ))}
              </select>
              {activeTags.length > 0 && (
                <button
                  className="clear"
                  onClick={() => setActiveTags([])}
                  style={{
                    padding: "var(--space-100) var(--space-200)",
                    borderRadius: 0,
                    border: "1px solid var(--c-border)",
                    background: "transparent",
                    color: "var(--c-dark)",
                    fontSize: "var(--fs-small)",
                    fontFamily: "var(--f-sans)",
                    cursor: "pointer",
                    transition: "color 0.15s, border-color 0.15s",
                  }}
                  onMouseEnter={e => { e.currentTarget.style.color = "var(--c-red)"; e.currentTarget.style.borderColor = "var(--c-red)"; }}
                  onMouseLeave={e => { e.currentTarget.style.color = "var(--c-dark)"; e.currentTarget.style.borderColor = "var(--c-border)"; }}
                >
                  Clear filters
                </button>
              )}
              <p className="result-count" style={{ fontSize: "var(--fs-micro)", color: "var(--c-dark)", margin: "0 0 0 auto", fontFamily: "var(--f-sans)", whiteSpace: "nowrap" }}>
                Showing {filtered.length} of {papers.length} papers
              </p>
            </div>

            {/* Tag filters */}
            <div style={{ display: "grid", gridTemplateColumns: "auto minmax(0, 1fr)", alignItems: "start", columnGap: "var(--space-100)", marginBottom: "var(--space-100)" }}>
              <span style={{
                fontFamily: "var(--f-sans)",
                fontSize: "var(--fs-micro)", fontWeight: 700, textTransform: "uppercase",
                letterSpacing: "0.8px", color: "var(--c-dark)", whiteSpace: "nowrap", paddingTop: "var(--space-050)",
              }}>Themes</span>
              {/* Wrapping tags in their own flex container (separate from the
                  label) means every wrapped line starts at this container's
                  left edge, which lines up with the first tag in row 1 —
                  not with the "Themes" label. */}
              <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", gap: "var(--space-100)" }}>
              {allTags.map((tag) => {
                const active = activeTags.includes(tag);
                const s = getTagStyle(tag);
                return (
                  <button
                    key={tag}
                    onClick={() => toggleTag(tag)}
                    style={{
                      padding: "var(--space-050) var(--space-150)",
                      borderRadius: 0,
                      border: (active ? "2.5px solid " + s.border : "1.5px solid " + s.border),
                      boxShadow: active ? "0 0 0 4px " + s.border + "40" : "none",
                      background: s.bg,
                      color: s.text,
                      fontSize: "var(--fs-micro)",
                      fontFamily: "var(--f-sans)",
                      cursor: "pointer",
                      transition: "all 0.2s",
                      fontWeight: active ? 700 : 500,
                      textAlign: "center",
                      whiteSpace: "normal",
                    }}
                  >
                    {tag}
                  </button>
                );
              })}
              </div>
            </div>
          </div>
          </div>

          {/* Papers, row by row */}
          <div className="dashboard-container" style={{ maxWidth: 1440, margin: "0 auto", paddingTop: "var(--space-300)", paddingBottom: "var(--space-1000)" }}>
            {filtered.length === 0 && (
              <div className="empty-state" style={{ textAlign: "center", padding: "var(--space-1000) var(--space-250)", color: "var(--c-dark)", fontSize: "var(--fs-small)", fontFamily: "var(--f-sans)", background: "var(--c-white)", border: "1px solid var(--c-border)", borderRadius: 0 }}>
                <p style={{ fontSize: "var(--fs-h2)", marginBottom: "var(--space-150)" }}>&empty;</p>
                No papers match your current filters.
              </div>
            )}

            <div className="papers-list">
            {filtered.map((paper, idx) => {
              const expanded = expandedId === paper.id;
              return (
                <div
                  key={paper.id}
                  className="paper-row"
                  style={{
                    background: "var(--c-white)",
                    border: "1px solid var(--c-border)",
                    borderRadius: 0,
                    overflow: "hidden",
                    transition: "box-shadow 0.15s, transform 0.15s",
                  }}
                  onMouseEnter={(e) => {
                    e.currentTarget.style.boxShadow = "0 12px 24px rgba(13,13,12,.16)";
                    e.currentTarget.style.transform = "translateY(-4px)";
                  }}
                  onMouseLeave={(e) => {
                    e.currentTarget.style.boxShadow = "none";
                    e.currentTarget.style.transform = "translateY(0)";
                  }}
                >
                  <div
                    className="paper-row-top"
                    onClick={() => setExpandedId(expanded ? null : paper.id)}
                    style={{ padding: "var(--space-200) var(--space-250)", cursor: "pointer" }}
                  >
                    <div className="paper-row-title" style={{ display: "flex", flexDirection: "column", gap: "var(--space-100)", paddingRight: "var(--space-200)" }}>
                      <h2 style={{ fontFamily: "var(--f-serif)", fontSize: "var(--fs-body)", fontWeight: 600, lineHeight: "var(--lh-title)", margin: "var(--space-025)" }}>
                        {paper.url ? (
                          <a
                            href={paper.url}
                            target="_blank"
                            rel="noopener noreferrer"
                            onClick={e => e.stopPropagation()}
                            style={{ display: "block", color: "var(--c-dark)", textDecoration: "none" }}
                            onMouseEnter={e => { e.currentTarget.style.textDecoration = "underline"; }}
                            onMouseLeave={e => { e.currentTarget.style.textDecoration = "none"; }}
                          >{paper.title}</a>
                        ) : <span style={{ display: "block", color: "var(--c-dark)" }}>{paper.title}</span>}
                      </h2>
                      <div style={{ display: "flex", gap: "var(--space-075)", flexWrap: "wrap" }}>
                        {paper.tags.filter(tag => tag !== "Penn Research").map((tag) => {
                          const s = getTagStyle(tag);
                          return (
                            <span key={tag} style={{ padding: "var(--space-025) var(--space-100)", borderRadius: 0, background: s.bg, color: s.text, fontSize: "var(--fs-micro)", fontWeight: 500, fontFamily: "var(--f-sans)", border: "1px solid " + s.border + "80", whiteSpace: "nowrap" }}>{tag}</span>
                          );
                        })}
                      </div>
                    </div>

                    <div className="paper-row-authors" style={{ fontFamily: "var(--f-sans)", fontSize: "var(--fs-small)", color: "var(--c-dark)", lineHeight: "var(--lh-body)", paddingTop: "var(--space-025)" }}>
                      {paper.authors}
                      <div style={{ marginTop: "var(--space-050)", fontFamily: "var(--f-sans)", fontSize: "var(--fs-micro)", textTransform: "uppercase", letterSpacing: "0.5px", color: "var(--c-dark)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{paper.journal}</div>
                    </div>

                    <div className="paper-row-year" style={{ fontFamily: "var(--f-sans)", fontSize: "var(--fs-small)", color: "var(--c-dark)", paddingTop: "var(--space-025)" }}>{paper.year}</div>

                    <div className="paper-row-preview" style={{ paddingTop: "var(--space-025)" }}>
                      <p style={{
                        margin: "var(--space-025)", fontFamily: "var(--f-sans)", fontSize: "var(--fs-small)", color: "var(--c-dark)", lineHeight: "var(--lh-body)", fontWeight: 300,
                        display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden",
                      }}>{paper.summary}</p>
                      <span style={{ marginTop: "var(--space-100)", display: "inline-flex", alignItems: "center", gap: "var(--space-075)", fontFamily: "var(--f-sans)", fontSize: "var(--fs-small)", color: "var(--c-red)" }}>
                        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" style={{ transition: "transform 0.25s", transform: expanded ? "rotate(180deg)" : "rotate(0)", flexShrink: 0 }}>
                          <path d="M2 5l5 5 5-5" stroke="var(--c-red)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
                        </svg>
                        {expanded ? "Show less" : "Full summary & details"}
                      </span>
                    </div>
                  </div>

                  {expanded && (
                    <div style={{ borderTop: "1px solid var(--c-border)", padding: "var(--space-200) var(--space-250) var(--space-250)" }}>
                      <p style={{ fontFamily: "var(--f-sans)", fontSize: "var(--fs-body)", color: "var(--c-dark)", lineHeight: "var(--lh-body)", margin: "0 0 var(--space-200)", fontWeight: 300 }}>
                        {paper.summary}
                      </p>
                      {paper.url && (
                        <a
                          href={paper.url}
                          target="_blank"
                          rel="noopener noreferrer"
                          onClick={e => e.stopPropagation()}
                          style={{
                            display: "inline-block", background: "var(--c-red)", color: "var(--c-white)",
                            fontFamily: "var(--f-sans)", fontSize: "var(--fs-small)", fontWeight: 600,
                            padding: "var(--space-100) var(--space-250)", borderRadius: 0, textDecoration: "none", transition: "background 0.15s",
                          }}
                          onMouseEnter={e => { e.currentTarget.style.background = "var(--c-red-dark)"; }}
                          onMouseLeave={e => { e.currentTarget.style.background = "var(--c-red)"; }}
                        >Read Paper &rarr;</a>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
            </div>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Dashboard />);
  </script>

  <script>
    // Auto-resize: sends page height to parent iframe so WordPress can resize accordingly
    function sendHeight() {
      var height = document.documentElement.scrollHeight;
      window.parent.postMessage({ frameHeight: height }, "*");
    }
    // Send on load
    window.addEventListener("load", sendHeight);
    // Send whenever content changes (e.g. cards expand/collapse)
    var observer = new ResizeObserver(sendHeight);
    observer.observe(document.body);
  </script>
</body>
</html>
